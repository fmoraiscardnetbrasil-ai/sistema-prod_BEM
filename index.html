<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Mensal de Produção - Cardnet</title>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdcdc;
            --primary-color: #0056b3;
            --primary-hover: #004085;
            --table-header: #0056b3;
            --table-header-text: #ffffff;
            --input-bg: #ffffff;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --table-header: #1f1f1f;
            --table-header-text: #e0e0e0;
            --input-bg: #2d2d2d;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(128, 128, 128, 0.05);
            padding: 15px;
            border-radius: 6px;
            align-items: center;
        }

        select, input[type="month"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        th {
            background-color: var(--table-header);
            color: var(--table-header-text);
        }

        td.number {
            text-align: right;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Consulta de Produção por Mês</h1>
            <div class="controls">
                <button id="themeToggle">🌓 Tema</button>
            </div>
        </header>

        <div class="search-bar">
            <label for="mesInput"><strong>Selecione o Mês:</strong></label>
            <input type="month" id="mesInput">
            <button id="consultarBtn">Consultar</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Empresa / Cidade</th>
                        <th style="text-align: right;">Total de Cartões Produzidos no Mês</th>
                    </tr>
                </thead>
                <tbody id="resultadoBody">
                    <tr>
                        <td colspan="2" style="text-align: center; color: gray;">Selecione um mês e clique em Consultar.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <footer>Desenvolvido por Flavio Morais</footer>
    </div>

    <script>
        // Configuração do Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://sistemaproducao-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Lista de empresas correspondente ao sistema
        const empresas = ["VB", "São Paulo", "Campinas", "Santos", "Ribeirão Preto"];

        // Definir o mês atual por padrão no input
        const mesInput = document.getElementById("mesInput");
        const hoje = new Date();
        const anoAtual = hoje.getFullYear();
        const mesAtual = String(hoje.getMonth() + 1).padStart(2, '0');
        mesInput.value = `${anoAtual}-${mesAtual}`;

        document.getElementById("consultarBtn").addEventListener("click", () => {
            const mesSelecionado = mesInput.value; // Formato: "AAAA-MM"
            if (!mesSelecionado) {
                alert("Por favor, selecione um mês.");
                return;
            }

            // Mapeia o caminho no Firebase baseado no ano e mês (ex: producao_mensal/2026-09)
            const caminhoRef = db.ref(`cidades_producao/historico_mensal/${mesSelecionado}`);

            caminhoRef.once("value").then((snapshot) => {
                const dados = snapshot.val() || {};
                const tbody = document.getElementById("resultadoBody");
                tbody.innerHTML = "";

                empresas.forEach((empresa, empIdx) => {
                    let tr = document.createElement("tr");

                    let tdEmpresa = document.createElement("td");
                    tdEmpresa.innerText = empresa;
                    tr.appendChild(tdEmpresa);

                    let tdTotal = document.createElement("td");
                    tdTotal.className = "number";

                    // Soma os valores dos dias (d1 até d31) salvos para esta empresa no mês
                    let somaEmpresa = 0;
                    if (dados[empIdx]) {
                        for (let d = 1; d <= 31; d++) {
                            let diaKey = "d" + d;
                            if (dados[empIdx][diaKey]) {
                                somaEmpresa += parseInt(dados[empIdx][diaKey]) || 0;
                            }
                        }
                    }

                    tdTotal.innerText = somaEmpresa.toLocaleString('pt-BR');
                    tr.appendChild(tdTotal);
                    tbody.appendChild(tr);
                });
            }).catch((error) => {
                alert("Erro ao consultar dados: " + error.message);
            });
        });

        // Alternância de Tema
        const themeToggle = document.getElementById("themeToggle");
        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });
    </script>
</body>
</html>
