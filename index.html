<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Produção - Cardnet</title>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdcdc;
            --primary-color: #0056b3;
            --primary-hover: #004085;
            --table-header: #0056b3;
            --table-header-text: #ffffff;
            --input-bg: #ffffff;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --table-header: #1f1f1f;
            --table-header-text: #e0e0e0;
            --input-bg: #2d2d2d;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 70vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
        }

        th {
            background-color: var(--table-header);
            color: var(--table-header-text);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        input[type="number"], input[type="text"] {
            width: 40px;
            padding: 4px;
            text-align: center;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 3px;
        }

        input[readonly] {
            background-color: rgba(128, 128, 128, 0.1);
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Controle de Produção</h1>
            <div class="controls">
                <button id="themeToggle">🌓 Tema</button>
                <button id="saveBtn">Salvar Alterações</button>
            </div>
        </header>

        <div class="table-responsive">
            <table id="prodTable">
                <thead>
                    <tr>
                        <th rowspan="2">Setor / Processo</th>
                        <th colspan="31">Dias do Mês</th>
                        <th rowspan="2">Total</th>
                    </tr>
                    <tr>
                        <!-- Gerador dinâmico dos dias 1 a 31 -->
                        <script>
                            for(let i=1; i<=31; i++) {
                                document.write(`<th>${i}</th>`);
                            }
                        </script>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Linhas injetadas via JavaScript mantendo dados seguros -->
                </tbody>
            </table>
        </div>
        <footer>Desenvolvido por Flavio Morais</footer>
    </div>

    <script>
        // Configuração do Firebase (Substitua pelas suas credenciais reais se necessário)
        const firebaseConfig = {
            databaseURL: "https://sistemaproducao-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Lista de setores padrão
        const setores = ["Gravação", "IDV", "Manuseio", "Conferência", "Embalagem"];

        function montarTabela() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            setores.forEach((setor, index) => {
                let tr = document.createElement("tr");
                let tdSetor = document.createElement("td");
                tdSetor.innerText = setor;
                tdSetor.style.fontWeight = "bold";
                tr.appendChild(tdSetor);

                // Criação dos inputs para os dias 1 a 31
                for (let d = 1; d <= 31; d++) {
                    let td = document.createElement("td");
                    let input = document.createElement("input");
                    input.type = "number";
                    input.min = "0";
                    input.dataset.setor = index;
                    input.dataset.dia = d;
                    input.className = "prod-input";
                    input.value = "0";
                    
                    // Evento para atualizar o total ao digitar
                    input.addEventListener("input", () => calcularTotaisRow(tr));
                    td.appendChild(input);
                    tr.appendChild(td);
                }

                // Coluna de Total por Setor
                let tdTotal = document.createElement("td");
                let inputTotal = document.createElement("input");
                inputTotal.type = "number";
                inputTotal.className = "row-total";
                inputTotal.readOnly = true;
                inputTotal.value = "0";
                tdTotal.appendChild(inputTotal);
                tr.appendChild(tdTotal);

                tbody.appendChild(tr);
            });
            carregarDadosFirebase();
        }

        function calcularTotaisRow(tr) {
            let inputs = tr.querySelectorAll(".prod-input");
            let soma = 0;
            inputs.forEach(inp => {
                let val = parseInt(inp.value) || 0;
                soma += val;
            });
            tr.querySelector(".row-total").value = soma;
        }

        function carregarDadosFirebase() {
            db.ref("producao/mensal").on("value", (snapshot) => {
                const dados = snapshot.val();
                if (dados) {
                    const linhas = document.querySelectorAll("#tableBody tr");
                    linhas.forEach((tr, setorIdx) => {
                        if (dados[setorIdx]) {
                            const inputs = tr.querySelectorAll(".prod-input");
                            inputs.forEach((inp, diaIdx) => {
                                let diaKey = "d" + (diaIdx + 1);
                                if (dados[setorIdx][diaKey] !== undefined) {
                                    inp.value = dados[setorIdx][diaKey];
                                }
                            });
                            calcularTotaisRow(tr);
                        }
                    });
                }
            });
        }

        document.getElementById("saveBtn").addEventListener("click", () => {
            const linhas = document.querySelectorAll("#tableBody tr");
            let dadosParaSalvar = {};

            linhas.forEach((tr, setorIdx) => {
                dadosParaSalvar[setorIdx] = {};
                const inputs = tr.querySelectorAll(".prod-input");
                inputs.forEach((inp, diaIdx) => {
                    let diaKey = "d" + (diaIdx + 1);
                    dadosParaSalvar[setorIdx][diaKey] = parseInt(inp.value) || 0;
                });
            });

            db.ref("producao/mensal").set(dadosParaSalvar)
                .then(() => alert("Dados salvos com sucesso!"))
                .catch((error) => alert("Erro ao salvar: " + error.message));
        });

        // Alternância de Tema
        const themeToggle = document.getElementById("themeToggle");
        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });

        window.onload = montarTabela;
    </script>
</body>
</html>
