<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidades e Produções - Cardnet</title>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdcdc;
            --primary-color: #0056b3;
            --primary-hover: #004085;
            --table-header: #0056b3;
            --table-header-text: #ffffff;
            --input-bg: #ffffff;
            --total-bg: #e9ecef;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --table-header: #1f1f1f;
            --table-header-text: #e0e0e0;
            --input-bg: #2d2d2d;
            --total-bg: #252525;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 75vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
        }

        th {
            background-color: var(--table-header);
            color: var(--table-header-text);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        input[type="number"] {
            width: 45px;
            padding: 4px;
            text-align: center;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 3px;
        }

        .total-row td {
            background-color: var(--total-bg);
            font-weight: bold;
        }

        .total-input {
            width: 45px;
            padding: 4px;
            text-align: center;
            font-weight: bold;
            background: transparent;
            border: none;
            color: var(--text-color);
        }

        footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Cidades e Produções - Osasco</h1>
            <div class="controls">
                <button id="themeToggle">🌓 Tema</button>
                <button id="saveBtn">Salvar Alterações</button>
            </div>
        </header>

        <div class="table-responsive">
            <table id="prodTable">
                <thead>
                    <tr>
                        <th>Dia / Empresa</th>
                        <!-- As empresas serão injetadas aqui dinamicamente nas colunas -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dias de 1 a 31 gerados via JavaScript -->
                </tbody>
                <tfoot>
                    <tr class="total-row" id="totalRow">
                        <td>TOTAL GERAL (Mês)</td>
                        <!-- Os totais embaixo de cada coluna de cliente vão aparecer aqui -->
                    </tr>
                </tfoot>
            </table>
        </div>
        <footer>Desenvolvido por Flavio Morais</footer>
    </div>

    <script>
        // Configuração do Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://sistemaproducao-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Lista de Clientes/Empresas nas colunas
        const empresas = ["VB", "Benefício 7", "São Paulo", "Campinas", "Santos"];

        function montarTabela() {
            const headerTr = document.querySelector("#prodTable thead tr");
            const tbody = document.getElementById("tableBody");
            const totalRow = document.getElementById("totalRow");

            // Limpa estruturas anteriores se houver
            while (headerTr.children.length > 1) { headerTr.removeChild(headerTr.lastChild); }
            tbody.innerHTML = "";
            while (totalRow.children.length > 1) { totalRow.removeChild(totalRow.lastChild); }

            // 1. Cria o cabeçalho com o nome de cada empresa
            empresas.forEach((empresa, empIdx) => {
                let th = document.createElement("th");
                th.innerText = empresa;
                headerTr.appendChild(th);

                // Cria também a célula correspondente no rodapé de totais embaixo
                let tdFoot = document.createElement("td");
                let inputFoot = document.createElement("input");
                inputFoot.type = "text";
                inputFoot.readOnly = true;
                inputFoot.value = "0";
                inputFoot.className = "total-input";
                inputFoot.dataset.empresaIndex = empIdx;
                tdFoot.appendChild(inputFoot);
                totalRow.appendChild(tdFoot);
            });

            // 2. Cria as linhas para os dias de 1 a 31
            for (let d = 1; d <= 31; d++) {
                let tr = document.createElement("tr");
                
                // Coluna fixa com o número do dia
                let tdDia = document.createElement("td");
                tdDia.innerText = "Dia " + d;
                tdDia.style.fontWeight = "bold";
                tr.appendChild(tdDia);

                // Inputs de cada empresa para este dia específico
                empresas.forEach((_, empIdx) => {
                    let td = document.createElement("td");
                    let input = document.createElement("input");
                    input.type = "number";
                    input.min = "0";
                    input.dataset.dia = d;
                    input.dataset.empresa = empIdx;
                    input.className = "prod-input";
                    input.value = "0";

                    // Sempre que digitar, recalcula o total embaixo da coluna daquela empresa
                    input.addEventListener("input", calcularTotaisColunas);
                    td.appendChild(input);
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            }

            carregarDadosFirebase();
        }

        // Função que calcula a soma de cima a baixo (do dia 1 ao 31) para cada coluna de empresa
        function calcularTotaisColunas() {
            empresas.forEach((_, empIdx) => {
                let inputsDaEmpresa = document.querySelectorAll(`.prod-input[data-empresa="${empIdx}"]`);
                let somaTotal = 0;

                inputsDaEmpresa.forEach(inp => {
                    somaTotal += parseInt(inp.value) || 0;
                });

                let inputFooter = document.querySelector(`.total-input[data-empresa-index="${empIdx}"]`);
                if (inputFooter) {
                    inputFooter.value = somaTotal;
                }
            });
        }

        function carregarDadosFirebase() {
            // Caminho preservado para não afetar dados já salvos anteriormente
            db.ref("cidades_producao/osasco/mensal").on("value", (snapshot) => {
                const dados = snapshot.val();
                if (dados) {
                    // Preenche os inputs com base no que está salvo no Firebase (dia x empresa)
                    for (let d = 1; d <= 31; d++) {
                        if (dados["d" + d]) {
                            empresas.forEach((_, empIdx) => {
                                let valorSalvo = dados["d" + d]["e" + empIdx];
                                if (valorSalvo !== undefined) {
                                    let input = document.querySelector(`.prod-input[data-dia="${d}"][data-empresa="${empIdx}"]`);
                                    if (input) {
                                        input.value = valorSalvo;
                                    }
                                }
                            });
                        }
                    }
                }
                // Após carregar tudo, atualiza os totais embaixo
                calcularTotaisColunas();
            });
        }

        document.getElementById("saveBtn").addEventListener("click", () => {
            let dadosParaSalvar = {};

            // Organiza estruturalmente por dias (d1 até d31) e empresas dentro para preservar integridade
            for (let d = 1; d <= 31; d++) {
                dadosParaSalvar["d" + d] = {};
                empresas.forEach((_, empIdx) => {
                    let input = document.querySelector(`.prod-input[data-dia="${d}"][data-empresa="${empIdx}"]`);
                    dadosParaSalvar["d" + d]["e" + empIdx] = input ? (parseInt(input.value) || 0) : 0;
                });
            }

            db.ref("cidades_producao/osasco/mensal").set(dadosParaSalvar)
                .then(() => alert("Dados salvos com sucesso!"))
                .catch((error) => alert("Erro ao salvar: " + error.message));
        });

        // Alternância de Tema Escuro/Claro
        const themeToggle = document.getElementById("themeToggle");
        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });

        window.onload = montarTabela;
    </script>
</body>
</html>
